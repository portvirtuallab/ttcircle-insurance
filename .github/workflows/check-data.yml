name: Check data

# The site is static, so nothing catches a broken tariff table at build time.
# This does: it runs on every change to the JSON that drives the simulator.
on:
  push:
    paths:
      - 'docs/data/**'
      - 'scripts/check_data.py'
      - '.github/workflows/check-data.yml'
  pull_request:
    paths:
      - 'docs/data/**'
      - 'scripts/check_data.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the simulator data
        run: python scripts/check_data.py
